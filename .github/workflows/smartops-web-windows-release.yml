name: Build and release SmartOps Web (Windows)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach the complete 4D + optional web package to a public GitHub Release"
        required: true
        type: boolean
        default: false
      version:
        description: "Optional release tag (e.g. v1.0.0); blank selects an automatic version"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - name: Resolve release version
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION.Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "v0.1.$env:GITHUB_RUN_NUMBER"
          }
          if ($env:PUBLISH_RELEASE -eq 'true' -and $version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like v1.0.0, or leave it blank."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Release version: $version"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Publish self-contained Windows executable
        shell: pwsh
        run: |
          dotnet publish ./SmartOps.4D.Web/SmartOps.4D.Web.csproj --configuration Release --runtime win-x64 --self-contained true --output "$env:RUNNER_TEMP/SmartOps-Web" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=none -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Report published file count
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/SmartOps-Web" -Recurse -File)
          Write-Host "Published files: $($files.Count)"
          Get-ChildItem "$env:RUNNER_TEMP/SmartOps-Web" -File | Select-Object Name,Length | Format-Table

      - name: Add double-click launcher and instructions
        shell: pwsh
        run: |
          Copy-Item ./packaging/windows/Start-SmartOps-Web.cmd "$env:RUNNER_TEMP/SmartOps-Web/Start-SmartOps-Web.cmd"
          Copy-Item ./packaging/windows/README-Windows.txt "$env:RUNNER_TEMP/SmartOps-Web/README-Windows.txt"
          if (!(Test-Path "$env:RUNNER_TEMP/SmartOps-Web/SmartOps.Web.exe")) { throw "Published executable is missing" }

      - name: Smoke-test the packaged web application
        shell: pwsh
        run: |
          $folder = "$env:RUNNER_TEMP/SmartOps-Web"
          $exe = Join-Path $folder "SmartOps.Web.exe"
          $process = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              if ($process.HasExited) { throw "SmartOps Web exited unexpectedly: $($process.ExitCode)" }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:5245/Account/Login' -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match 'SMARTOPS') {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw 'Web login page did not become ready' }
            Write-Host 'Smoke test succeeded: login page responds with HTTP 200.'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package 4D integration project and optional web ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "SmartOps-Integration"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          # 4D creates its data file on first use; GO_StartLAN then seeds test data.
          Copy-Item -Path "./SmartOps.4D" -Destination (Join-Path $stage "SmartOps.4D") -Recurse
          $project = Join-Path $stage "SmartOps.4D/Project/smartops4d.4DProject"
          $sampleData = Join-Path $stage "SmartOps.4D/Resources/sample-data.json"
          if (!(Test-Path $project)) { throw "4D project not found in package" }
          if (!(Test-Path $sampleData)) { throw "4D integration test data not found" }

          # Optional standalone ASP.NET Core app packaged separately inside release.
          $webZip = Join-Path $stage "SmartOps-Web-Windows-x64.zip"
          Compress-Archive -Path "$env:RUNNER_TEMP/SmartOps-Web/*" -DestinationPath $webZip -Force
          Copy-Item "./packaging/windows/README-Integration.txt" (Join-Path $stage "README-START-HERE.txt")

          $unexpected = @(Get-ChildItem $stage -Recurse -File | Where-Object {
            $_.Name -match '(?i)\.(4DD|4DIndx|4DJournal|pfx|pem|keystore|jks)$'
          })
          if ($unexpected.Count -gt 0) { throw "Unexpected database or key files: $($unexpected.FullName -join ', ')" }

          Compress-Archive -Path "$stage/*" -DestinationPath "$env:GITHUB_WORKSPACE/SmartOps-Integration-Windows-x64.zip" -Force
          Write-Host "Release package: SmartOps-Integration-Windows-x64.zip"
          Get-ChildItem $stage | Select-Object Name,Length | Format-Table

      - name: Store integration package as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartOps-Integration-Windows-x64
          # Actions automatically ZIPs artifacts; upload the folder contents.
          path: ${{ runner.temp }}/SmartOps-Integration/
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release with complete integration package
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:RELEASE_VERSION" "SmartOps-Integration-Windows-x64.zip" --title "SmartOps $env:RELEASE_VERSION" --target "$env:GITHUB_SHA" --generate-notes
